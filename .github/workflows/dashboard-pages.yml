name: Deploy VISION dashboard

on:
  push:
    branches: [main]
    paths:
      - 'Noah/backend/dashboard/**'
      - '.github/workflows/dashboard-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test dashboard data handling
        run: node --test Noah/backend/dashboard/model.test.mjs Noah/backend/dashboard/live-data.test.mjs
      - name: Build static dashboard
        run: node Noah/backend/dashboard/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: Noah/backend/dashboard/dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
